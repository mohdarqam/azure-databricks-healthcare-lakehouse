name: databricks-notebooks-ci

# Lightweight CI: lint the PySpark notebooks on every push/PR.
# Extend later with databricks-connect integration tests or a bundle deploy.

on:
  push:
    branches: [ main ]
    paths: [ 'databricks/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'databricks/**' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install flake8
      - name: Lint notebooks (syntax + undefined names)
        run: flake8 databricks/notebooks --select=E9,F63,F7,F82 --show-source
